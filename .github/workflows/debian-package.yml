# Native Debian 13 (trixie) .deb — built inside a debian:13 container so the
# binary links trixie's glibc/WebKit, not an older Ubuntu's. Push a `deb/<version>`
# tag matching the workspace version to build and attach it to a dedicated Release;
# older distros keep using the ubuntu-22.04 deb from the v* releases.
name: Debian 13 package

on:
  push:
    tags: ['deb/*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 60
    steps:
      # The bare image has no git/curl/ca-certificates, so checkout must wait for
      # these. Container jobs run as root — no sudo anywhere below.
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates xz-utils \
            build-essential pkg-config nodejs npm \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev file

      - uses: actions/checkout@v4

      - name: Tag matches version
        if: startsWith(github.ref, 'refs/tags/deb/')
        run: |
          v="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          [ -n "$v" ] || { echo "no version in Cargo.toml"; exit 1; }
          [ "$v" = "${GITHUB_REF_NAME#deb/}" ] || {
            echo "tag ${GITHUB_REF_NAME} does not match workspace version $v"; exit 1;
          }

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: deb13-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            deb13-cargo-

      - name: Install the Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Install frontend dependencies
        working-directory: crates/easyssh-gui/ui
        run: npm ci

      # The cache restores bundles an earlier run left behind; the bundler only
      # adds to bundle/, so clear it to collect nothing but this run's output.
      - name: Drop bundles left by an earlier run
        run: rm -rf target/release/bundle

      - name: Build the deb
        working-directory: crates/easyssh-gui
        run: tauri build --bundles deb

      - name: Rename and verify on trixie
        # Container run steps use the image's sh (dash on Debian), not bash: no arrays.
        run: |
          v="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          set -- target/release/bundle/deb/*"${v}"*.deb
          [ "$#" -eq 1 ] && [ -e "$1" ] || { echo "expected one deb, got: $*"; exit 1; }
          cp "$1" "EasySSH-${v}-debian13-amd64.deb"
          # Install for real: dpkg checks the dependency list, and ldd proves every
          # linked library resolves on a stock trixie.
          dpkg -i "EasySSH-${v}-debian13-amd64.deb" || apt-get -f install -y
          if ldd /usr/bin/EasySSH | grep "not found"; then exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: debian13-deb
          path: EasySSH-*-debian13-amd64.deb
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/deb/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: EasySSH ${{ github.ref_name }} (Debian 13)
          body: Native Debian 13 (trixie) build; older distros use the Ubuntu 22.04 deb from v* releases.
          files: EasySSH-*-debian13-amd64.deb
          fail_on_unmatched_files: true