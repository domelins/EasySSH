[workspace]
resolver = "2"
members = ["crates/easyssh-core", "crates/easyssh", "crates/easyssh-gui"]
exclude = ["vendor/tray-icon", "vendor/vt100"]
# GUI excluded from bare cargo builds: `cargo build`/`test`/`install` at the root
# build core + TUI only, with no Tauri/npm toolchain (tech-gui.md §3.1).
default-members = ["crates/easyssh-core", "crates/easyssh"]

[workspace.package]
version = "1.1.7"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/domelins/EasySSH"

[workspace.dependencies]
# Async runtime — explicit features only; avoids pulling in unused tokio subsystems.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "process", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
dirs = "5"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Patch tray-icon to the vendored copy that initialises cbSize on Windows.
[patch.crates-io]
tray-icon = { path = "vendor/tray-icon" }
